# Beispiel-Server-Block für nginx (TLS-Zertifikate z. B. via certbot).
server {
    listen 80;
    server_name todo.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name todo.example.com;

    ssl_certificate     /etc/letsencrypt/live/todo.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/todo.example.com/privkey.pem;

    # --- Nur wenn die Domain hinter Cloudflare liegt: echte Besucher-IP statt Cloudflare-Adresse verwenden
    # (sonst teilen sich viele Besucher eine IP, und Rate-Limits/Audit-Log sind wertlos). Einmalig erzeugen:
    #   for i in $(curl -s https://www.cloudflare.com/ips-v4 https://www.cloudflare.com/ips-v6); do
    #     echo "set_real_ip_from $i;"; done > /etc/nginx/cloudflare-realip.conf
    #   echo "real_ip_header CF-Connecting-IP;" >> /etc/nginx/cloudflare-realip.conf
    # (Liste gelegentlich erneuern.) Dann hier einkommentieren:
    #include /etc/nginx/cloudflare-realip.conf;

    # Sprachaufnahmen (WAV) – 12 MB reichen für ~6 Minuten, das Backend begrenzt zusätzlich.
    client_max_body_size 12m;
    server_tokens off;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;   # nicht anhängen: keine gefälschten Client-IPs
        proxy_set_header X-Forwarded-Proto $scheme;
        # KI-Antworten (Ollama) und Transkription können dauern
        proxy_read_timeout 300s;
        proxy_connect_timeout 30s;
    }

    # Live-Streams (Server-Sent Events: Web-UI, Agent-Inbox, Android-Geräte): nicht puffern, lange offen halten
    location ~ ^/api/(agent-bus/(stream|inbox/stream)|devices/stream)$ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
}
