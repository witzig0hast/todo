name: Android APK

on:
  workflow_dispatch:
    inputs:
      server_url:
        description: "Server-Adresse fest einbauen (optional, z. B. https://todo.example.com). Leer = Eingabe beim ersten Start."
        required: false
        default: ""
      release:
        description: "Als GitHub-Release veröffentlichen"
        type: boolean
        default: false
  push:
    tags: ["android-v*"]
    paths: ["android/**", ".github/workflows/android.yml"]

permissions:
  contents: write # nur für das Anlegen eines Releases nötig

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      # optional: fertige APK automatisch an den eigenen Todo-Server verteilen (App meldet dann „Update verfügbar“)
      TODO_SERVER_URL: ${{ secrets.TODO_SERVER_URL }}
      TODO_UPLOAD_TOKEN: ${{ secrets.TODO_UPLOAD_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android-SDK vorbereiten (auf dem Runner vorinstalliert)
        run: |
          SDKM="$(ls "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | head -n1)"
          yes | "$SDKM" --licenses > /dev/null || true
          "$SDKM" "platforms;android-35" "build-tools;35.0.0" > /dev/null

      - uses: gradle/actions/setup-gradle@v4

      - name: Server-URL prüfen
        id: cfg
        env:
          SERVER_URL: ${{ github.event.inputs.server_url }}
        run: |
          if [ -n "$SERVER_URL" ] && ! printf '%s' "$SERVER_URL" | grep -Eq '^https://[A-Za-z0-9.-]+(:[0-9]+)?$'; then
            echo "Ungültige Server-URL (erwartet: https://host[:port], ohne Pfad)"; exit 1
          fi
          echo "server_url=$SERVER_URL" >> "$GITHUB_OUTPUT"

      - name: Signierschlüssel bereitstellen (optional)
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
            echo "ANDROID_KEYSTORE_FILE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
            echo "SIGNING=release-key" >> "$GITHUB_ENV"
          else
            echo "SIGNING=debug-key" >> "$GITHUB_ENV"
          fi

      - name: APK bauen
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          SERVER_URL: ${{ steps.cfg.outputs.server_url }}
        run: |
          ./gradlew --no-daemon assembleRelease \
            -PserverUrl="$SERVER_URL" \
            -PversionCode="${{ github.run_number }}" \
            -PversionName="1.0.${{ github.run_number }}"

      - name: APK umbenennen und Signatur prüfen
        run: |
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/todo-1.0.${{ github.run_number }}.apk"
          CERT="$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "dist/todo-1.0.${{ github.run_number }}.apk" | grep -m1 'SHA-256 digest' | sed 's/.*: //')"
          echo "CERT_SHA256=$CERT" >> "$GITHUB_ENV"
          {
            echo "### Android-APK gebaut"
            echo "- Datei: \`todo-1.0.${{ github.run_number }}.apk\` (versionCode ${{ github.run_number }})"
            echo "- Signatur: **$SIGNING**, Zertifikat SHA-256: \`$CERT\`"
            if [ "$SIGNING" = "debug-key" ]; then
              echo "- Hinweis: Mit dem Debug-Schlüssel signiert. Für Updates ohne Neuinstallation ein dauerhaftes Keystore als Secret hinterlegen (siehe android/README.md)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: todo-android
          path: dist/*.apk
          if-no-files-found: error

      - name: An den Todo-Server verteilen (optional)
        if: env.TODO_UPLOAD_TOKEN != '' && env.TODO_SERVER_URL != ''
        run: |
          curl -fsS -X POST \
            -H "Authorization: Bearer $TODO_UPLOAD_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@dist/todo-1.0.${{ github.run_number }}.apk" \
            "$TODO_SERVER_URL/api/app/android?version_code=${{ github.run_number }}&version_name=1.0.${{ github.run_number }}" > /dev/null
          echo "- An $TODO_SERVER_URL verteilt – installierte Apps melden das Update." >> "$GITHUB_STEP_SUMMARY"

      - name: Release veröffentlichen
        if: startsWith(github.ref, 'refs/tags/android-v') || github.event.inputs.release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('android-v1.0.{0}', github.run_number) }}
          name: Android ${{ github.run_number }}
          files: dist/*.apk
          fail_on_unmatched_files: true
          body: |
            Todo für Android 1.0.${{ github.run_number }}
            Signatur-Zertifikat (SHA-256): `${{ env.CERT_SHA256 }}`
            Installierte Apps mit derselben Signatur lassen sich direkt aktualisieren.
